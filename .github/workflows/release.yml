name: Release Binaries

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write   # needed to upload release assets

jobs:
  build:
    name: Build & publish binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -count=1

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BINARY_NAME="gitops-compose-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "${BINARY_NAME}" \
            ./cmd

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitops-compose-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gitops-compose-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gitops-compose-${{ matrix.goos }}-${{ matrix.goarch }}
